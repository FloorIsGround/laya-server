[project]
name = "laya-api"
version = "0.1.0"
description = "Internal HTTP inference service for Laya"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "laya==0.3.4",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
